<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evolve Contact Directory</title>
<style>
:root {
  --accent: #2D6A6A;
  --accent-hover: #1f4d4d;
  --accent-soft: #E7F0EF;
  --bg: #FAFAF9;
  --card: #FFFFFF;
  --ink: #1C2B33;
  --muted: #5B6B72;
  --line: #DCE3E3;
  --mark: #E7F0EF;
  --mark-ink: #2D6A6A;
  --warn-bg: #FFF3D6;
  --warn-ink: #7A5300;
  --on-accent: #FFFFFF;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.logo { display: block; height: 32px; width: auto; }
.brand h1 { margin: 0; text-transform: uppercase; letter-spacing: 0; }
h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.intro { margin: 0 0 14px; color: var(--muted); font-size: 14px; }

/* Search (same as FAQ) */
.search { position: relative; margin-bottom: 18px; }
.search svg { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--card); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 14px 76px 14px 16px; outline: none; transition: border-color .15s ease;
}
.search input::placeholder { color: var(--muted); opacity: .8; }
.search input:focus { border-color: var(--accent); }
.search input::-webkit-search-cancel-button { display: none; }
.clear {
  position: absolute; right: 40px; top: 50%; transform: translateY(-50%);
  border: 0; background: transparent; color: var(--muted);
  width: 30px; height: 30px; cursor: pointer; font-size: 20px; line-height: 1; border-radius: 6px; display: none;
}
.clear.show { display: block; }
.clear:hover { color: var(--ink); }

/* Section titles (same as FAQ umbrella titles) */
.umbrella { margin: 0 0 32px; }
.umbrella-title { margin: 18px 0 16px; padding-bottom: 10px; font-size: 26px; font-weight: 700; color: #3A3E43; letter-spacing: -0.02em; border-bottom: 4px solid var(--accent); }
.region { margin: 18px 0 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
.region:first-of-type { margin-top: 0; }

.grid { display: grid; gap: 10px; }
.grid-main { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.grid-dept { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.grid-loc { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.icon { width: 38px; height: 38px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
.icon svg { width: 20px; height: 20px; }

/* Main numbers */
.main-card { display: flex; align-items: center; gap: 14px; }
.main-card.alert .icon { background: var(--warn-bg); color: var(--warn-ink); }
.main-label { font-size: 12.5px; color: var(--muted); }
.main-num { font-size: 18px; font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.staff-only { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 100px; background: var(--warn-bg); color: var(--warn-ink); vertical-align: 1px; }
.main-note { margin-top: 2px; }
.num-or { font-size: 12px; color: var(--muted); line-height: 1.2; }
.num-row { display: flex; align-items: center; gap: 6px; }
.mini-copy {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px;
  font: inherit; font-size: 12px; font-weight: 600;
  background: none; border: 0; border-radius: 6px; color: var(--muted); cursor: pointer;
}
.mini-copy svg { width: 13px; height: 13px; }
.mini-copy:hover { background: var(--accent-soft); color: var(--accent); }
.mini-copy.done { color: var(--accent); }
.main-note { font-size: 12px; color: var(--muted); }

/* Departments */
.dept { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
.dept-text { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.dept-name { font-size: 14.5px; font-weight: 600; }
.dept-press { font-size: 12.5px; color: var(--muted); }
.ext {
  margin-left: auto; flex-shrink: 0;
  font-size: 13px; font-weight: 700;
  background: var(--accent-soft); color: var(--accent);
  border-radius: 100px; padding: 4px 12px;
}
.umbrella-head { margin: 18px 0 16px; padding-bottom: 10px; border-bottom: 4px solid var(--accent); }
.umbrella-head .umbrella-title { margin: 0; padding: 0; border: 0; }
.umbrella-sub { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.umbrella-sub a { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.umbrella-sub a:hover { color: var(--accent-hover); }

/* Locations */
.loc-name { font-size: 16px; font-weight: 700; margin: 0 0 2px; }
.loc-addr { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
.loc-lines { display: grid; gap: 3px; font-size: 14px; margin-bottom: 12px; }
.loc-lines a { color: var(--ink); font-weight: 600; text-decoration: none; }
.loc-lines a:hover { color: var(--accent); }
.loc-lines .k { display: inline-block; width: 44px; color: var(--muted); font-weight: 400; }
.loc-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.pill-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: 12.5px; font-weight: 600;
  background: var(--card); color: var(--accent);
  border: 1.5px solid var(--accent); border-radius: 100px;
  padding: 5px 13px; cursor: pointer; text-decoration: none;
  transition: background .15s ease, color .15s ease;
}
.pill-btn svg { width: 14px; height: 14px; }
.pill-btn:hover, .pill-btn.done { background: var(--accent); color: var(--on-accent); }

mark { background: var(--mark); color: var(--mark-ink); padding: 0 2px; border-radius: 3px; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; }
.help { margin-top: 28px; font-size: 14px; color: var(--muted); text-align: center; }
.help strong { color: var(--ink); }

@media (max-width: 480px) {
  .wrap { padding: 20px 14px; }
  h1 { font-size: 19px; }
  .umbrella-title { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { .search input, .pill-btn { transition: none; } }
</style>
</head>

<script>
/* ---------------------------------------------------------------
   LIVE DATA: read from the Google Sheet "Evolve Phone Directory – Data".
   Edit the Sheet, not this file. Tab names and column headers must stay
   the same (column order and rows can change freely).
     Main Phone Numbers:     Number, Type, Notes
     Locations Addresses:    Facility Name, Street Address, Address Line 2, City, State, ZIP Code
     Department Extensions:  Department, Extension
   A location card shows its front desk extension when a department is
   named "<Town> Front Desk" (e.g. "Syosset Front Desk").
   FALLBACK below is shown only if the Sheet can't be reached.
---------------------------------------------------------------- */
const SHEET_ID = "1RoaY3qjpDTGsLUC68vNGsiObzPWWtQtyP342h8VKPlw";
const TABS = { main: "Main Phone Numbers", locs: "Locations Addresses", depts: "Department Extensions" };
const STATE_NAMES = { NY: "New York", NC: "North Carolina" };
const STAFF_DIR_URL = "https://sites.google.com/evolvepsychiatry.com/office/staff-use/staff-directory";
const HOURS_URL = "https://docs.google.com/spreadsheets/d/1LEglerrTg1FOhjO4C73po5sQe3Vg4HbqAv9iHiIdaEk/edit?usp=sharing";

const FALLBACK = {
  main: [
    { "number": "8444432563", "type": "Main number", "notes": "844-4HEALME" },
    { "number": "6316733233", "type": "Main number", "notes": "Alternative main number" },
    { "number": "8885711288", "type": "Fax", "notes": "" }
  ],
  locs: [
    { "facility name": "Massapequa, NY",  "street address": "5550 Merrick Rd",          "address line 2": "",          "city": "Massapequa",     "state": "NY", "zip code": "11758" },
    { "facility name": "Syosset, NY",     "street address": "175 Jericho Turnpike",     "address line 2": "Suite 216", "city": "Syosset",        "state": "NY", "zip code": "11791" },
    { "facility name": "Garden City, NY", "street address": "623 Stewart Ave",          "address line 2": "Suite 203", "city": "Garden City",    "state": "NY", "zip code": "11530" },
    { "facility name": "Albany, NY",      "street address": "63 Shaker Rd",             "address line 2": "Suite 203", "city": "Albany",         "state": "NY", "zip code": "12204" },
    { "facility name": "Hauppauge, NY",   "street address": "521 Hauppauge Rd",         "address line 2": "Suite 103", "city": "Hauppauge",      "state": "NY", "zip code": "11788" },
    { "facility name": "Patchogue, NY",   "street address": "250 Patchogue-Yaphank Rd", "address line 2": "Unit 12",   "city": "East Patchogue", "state": "NY", "zip code": "11772" },
    { "facility name": "Wilmington, NC",  "street address": "1508 Medical Center Dr",   "address line 2": "",          "city": "Wilmington",     "state": "NC", "zip code": "28401" }
  ],
  depts: [
    ["Hauppauge Front Desk", "801"], ["Syosset Front Desk", "802"], ["New Patient Department (NPC)", "804"],
    ["TMS & Spravato Department", "805"], ["Reception Queue – All Locations", "807"], ["Massapequa Front Desk", "808"],
    ["Patchogue Front Desk", "811"], ["Wilmington Front Desk", "812"], ["Albany Front Desk", "813"],
    ["Administration", "814"], ["Garden City Front Desk", "820"], ["Billing Department", "830"],
    ["Medical Records & Disability", "831"], ["Intake Coordinator (Felicia Pierce)", "840"]
  ].map(([department, extension]) => ({ department, extension }))
};

/* --------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const state = { query: "" };
let MAIN = [], DEPTS = [], LOCS = [];

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function terms() { return state.query.toLowerCase().split(/\s+/).filter(Boolean); }
function hl(text, words) {
  const safe = esc(text);
  if (!words.length) return safe;
  return safe.replace(new RegExp("(" + words.map(w => reEsc(esc(w))).join("|") + ")", "gi"), "<mark>$1</mark>");
}
function digits(s) { return String(s).replace(/\D/g, ""); }
function fmtPhone(s) {
  let d = digits(s);
  if (d.length === 11 && d[0] === "1") d = d.slice(1);
  return d.length === 10 ? `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}` : String(s).trim();
}
function tel(s) { return "tel:+1" + digits(s).slice(-10); }
function matches(fields, words) {
  if (!words.length) return true;
  const hay = fields.join(" ").toLowerCase();
  const hayDigits = digits(hay);
  return words.every(w => hay.includes(w) || (digits(w).length >= 3 && hayDigits.includes(digits(w))));
}

/* CSV -> array of row objects keyed by lowercase header */
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { f += '"'; i++; }
      else if (c === '"') q = false;
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(f); rows.push(row); row = []; f = "";
    } else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
  return rows
    .filter(r => r.some(v => v.trim()))
    .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
}

function loadTab(name) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&t=${Date.now()}`;
  return fetch(url, { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(t => { if (/^\s*</.test(t)) throw new Error("Sheet not shared"); return parseCSV(t); });
}

function setData(raw) {
  MAIN = raw.main.filter(r => r.number).map(r => ({
    label: r.type || "Phone", number: fmtPhone(r.number), note: r.notes || ""
  }));
  DEPTS = raw.depts.filter(r => r.department && r.extension).map(r => ({
    name: r.department, ext: digits(r.extension) || r.extension
  }));
  LOCS = raw.locs.filter(r => r["facility name"] || r["street address"]).map(r => {
    const town = (r["facility name"] || r.city).split(",")[0].trim();
    const desk = DEPTS.find(d => d.name.toLowerCase() === (town + " front desk").toLowerCase());
    const st = (r.state || "").toUpperCase();
    return {
      name: r["facility name"] || town,
      street: [r["street address"], r["address line 2"]].filter(Boolean).join(", "),
      city: `${r.city}, ${st} ${r["zip code"]}`.trim(),
      region: STATE_NAMES[st] || st || "Other",
      deskExt: desk ? desk.ext : ""
    };
  });
}

/* Copy that works inside Google Sites embeds: the textarea method runs first
   because sandboxed frames usually block navigator.clipboard and prompt(). */
function legacyCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", "");
  ta.style.cssText = "position:absolute;left:-9999px;top:0;opacity:0";
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
function copyToClipboard(text) {
  if (legacyCopy(text)) return Promise.resolve();
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return Promise.reject(new Error("Clipboard blocked"));
}

function copyText(text, btn, doneLabel) {
  const label = btn.querySelector("span") || btn;
  const original = label.innerHTML;
  const done = () => {
    label.textContent = doneLabel; btn.classList.add("done");
    setTimeout(() => { label.innerHTML = original; btn.classList.remove("done"); }, 1600);
  };
  copyToClipboard(text).then(done, () => { label.textContent = "Press Ctrl+C"; setTimeout(() => { label.innerHTML = original; }, 2000); });
}

const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICONS = {
  phone: svg('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'),
  fax: svg('<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="9" rx="2"/><path d="M6 14h12v7H6z"/>'),
  copy: svg('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>'),
  sick: svg('<path d="M19.3 13.6A8.5 8.5 0 1 0 13 20.4"/><path d="M7.5 10.2q1 -.8 2 0M13.5 10.2q1 -.8 2 0"/><path d="M10 15.2l8.2 3.3"/><circle cx="19.6" cy="19.1" r="1.4"/>'),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  map: svg('<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>')
};

function section(title, body, sub) {
  const el = document.createElement("section");
  el.className = "umbrella";
  el.innerHTML = `<div class="umbrella-head"><h2 class="umbrella-title">${esc(title)}</h2>${sub ? `<p class="umbrella-sub">${sub}</p>` : ""}</div>`;
  el.append(body);
  return el;
}

function renderList() {
  const list = $("#list"); list.innerHTML = "";
  const words = terms();
  let total = 0;

  const mains = MAIN.filter(m => matches([m.label, m.number], words));
  if (mains.length) {
    const grid = document.createElement("div"); grid.className = "grid grid-main";
    const groups = [];
    mains.forEach(m => {
      const key = m.label.trim().toLowerCase();
      const g = groups.find(x => x.key === key);
      g ? g.items.push(m) : groups.push({ key, label: m.label, items: [m] });
    });
    groups.forEach(g => {
      const first = g.items[0];
      let label = g.label.replace(/\b\w/g, ch => ch.toUpperCase());
      if (g.items.length > 1 && !/s$/i.test(label)) label += "s";
      const c = document.createElement("div");
      c.className = "card main-card" + (first.alert ? " alert" : "");
      c.innerHTML = `<span class="icon">${first.alert ? ICONS.sick : /fax/i.test(g.label) ? ICONS.fax : ICONS.phone}</span>
        <div><div class="main-label">${hl(label, words)}${first.alert ? '<span class="staff-only">Staff only</span>' : ""}</div>
        ${g.items.map(m => `<div class="num-row"><span class="main-num">${hl(m.number, words)}</span>${m.alert ? "" : `<button class="mini-copy" type="button" data-num="${esc(m.number)}" aria-label="Copy ${esc(m.number)}" title="Copy">${ICONS.copy}Copy</button>`}</div>`).join('<div class="num-or">or</div>')}</div>`;
      c.querySelectorAll(".mini-copy").forEach(b => b.addEventListener("click", () => {
        const done = () => { b.innerHTML = ICONS.check + "Copied"; b.classList.add("done"); setTimeout(() => { b.innerHTML = ICONS.copy + "Copy"; b.classList.remove("done"); }, 1400); };
        copyToClipboard(b.dataset.num).then(done, () => {});
      }));
      grid.append(c);
    });
    list.append(section("Phone Numbers", grid, esc("Give these to patients, pharmacies, insurance companies, and other outside callers to reach us."))); total += mains.length;
  }

  const depts = DEPTS.filter(d => matches([d.name, "ext " + d.ext, "x" + d.ext], words));
  if (depts.length) {
    const grid = document.createElement("div"); grid.className = "grid grid-dept";
    depts.forEach(d => {
      const c = document.createElement("div");
      c.className = "card dept";
      c.innerHTML = `<div class="dept-text"><span class="dept-name">${hl(d.name, words)}</span></div>
        <span class="ext">Ext ${hl(d.ext, words)}</span>`;
      grid.append(c);
    });
    list.append(section("Department Extensions", grid, esc("Use these extensions to transfer calls to the right department or office.") + ` Looking for a specific person? Find their extension in the <a href="${STAFF_DIR_URL}" target="_blank" rel="noopener">Staff Directory</a>.`)); total += depts.length;
  }

  const locs = LOCS.filter(l => matches([l.name, l.street, l.city], words));
  if (locs.length) {
    const grid = document.createElement("div"); grid.className = "grid grid-loc";
    [...locs].sort((a, b) => a.name.localeCompare(b.name)).forEach(l => {
        const full = `${l.street}, ${l.city}`;
        const c = document.createElement("div");
        c.className = "card";
        c.innerHTML = `<h3 class="loc-name">${hl(l.name, words)}</h3>
          <p class="loc-addr">${hl(l.street, words)}<br>${hl(l.city, words)}</p>
          <div class="loc-actions">
            <button class="pill-btn copy-addr" type="button">${ICONS.copy}<span>Copy Address</span></button>
            <a class="pill-btn" href="${HOURS_URL}" target="_blank" rel="noopener">${ICONS.clock}<span>Office Hours</span></a>
          </div>`;
        c.querySelector(".copy-addr").addEventListener("click", e => copyText(full, e.currentTarget, "Address copied"));
        grid.append(c);
    });
    list.append(section("Locations and Addresses", grid)); total += locs.length;
  }

  if (!total) {
    list.innerHTML = `<div class="empty"><strong>Nothing matches${state.query ? ` “${esc(state.query)}”` : ""}.</strong>Try a town name, department, or the last 4 digits of a number.</div>`;
  }
}

$("#list").innerHTML = '<div class="empty">Loading directory…</div>';
Promise.all([loadTab(TABS.main), loadTab(TABS.locs), loadTab(TABS.depts)])
  .then(([main, locs, depts]) => setData({ main, locs, depts }))
  .catch(err => { console.warn("Phone directory: Sheet unavailable, showing saved copy.", err); setData(FALLBACK); })
  .finally(renderList);
</script>
</body>
</html>
